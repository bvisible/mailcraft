[package]
name = "mailcraft-jmap"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "MailCraft JMAP (RFC 8620 and 8621) without sockets or browser APIs: an async client over any HTTP implementation, and an in-process server for the tests of the crates that sit on it"

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
log = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[features]
# An in-process JMAP server that holds a client to the protocol (`standin`), for the tests of the
# crates that sit on this one. Never in a build that isn't a test's.
stand-in = []

[dev-dependencies]
proptest = { workspace = true }
